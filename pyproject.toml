[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suta-langues"
version = "0.1.0"
description = "API de transcription des langues ivoiriennes pour SUTA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
asr = ["omnilingual-asr>=0.2,<1"]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/suta_langues"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

